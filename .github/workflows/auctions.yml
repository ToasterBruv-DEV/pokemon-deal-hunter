name: Scan auctions

run-name: ${{ github.event_name == 'schedule' && 'Automatic auction wake-up (does nothing if auto is off)' || 'Manual auction scan' }}

# Pressing Refresh auctions on the website runs this by hand and always works.
# The 5 minute wake-up only scans when automatic auction scanning is switched on in the website.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auctions
  cancel-in-progress: false

jobs:
  auctions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run auction scanner
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
        run: python auctions.py

      - name: Save results
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update auctions"
            for i in 1 2 3 4; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi
