name: Scan eBay

run-name: ${{ github.event_name == 'schedule' && 'Automatic wake-up (does nothing if auto scan is off)' || 'Manual scan' }}

# Pressing Scan now (or Run workflow here) is a manual scan and always runs.
# The 5 minute wake-up only scans when Auto scan is switched ON in the website,
# and then only as often as the "run every" setting says. With Auto scan OFF it
# quits in a few seconds.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      flag_price_pct:
        description: "Optional, this run only: flag listings priced at or below this % of market value"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          FLAG_PRICE_PCT_OVERRIDE: ${{ github.event.inputs.flag_price_pct }}
        run: python scan.py

      - name: Save results
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update deals"
            for i in 1 2 3 4; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi
